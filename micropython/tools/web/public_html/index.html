<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>&#x2602;&#x1F321; THERMOHYGRO</title>
  <link rel="stylesheet" type="text/css" media="all" href="styles.css"/>
  <script src="emulator.js"></script>
  <script type="text/javascript">
    // shorten typing: document.getElementById -> $id
    function $id(id)
    {
      return document.getElementById(id);
    }
 
    function form_answer_hardware_line()
    {
      // query (port) is string like "1" or empty
      var query=document.getElementById("query_hardware_line").value;
      var answer=document.getElementById("answer_hardware_line");
      // answer from hardware in string format
      fetch("line?port="+query)
      .then(response => {return response.text();})
      .then(text => answer.innerHTML=text);
      // answer is string like:
      // "S1=2C3A02D0 T1=29.19 C RH1=40.20 % S2=2C3A1297 T2=28.74 C RH2=40.63 %"
    }

    function update_html_from_json(json_str)
    {
      //json_str="{'serial1':123456,'t1':29.26,'rh1':40.06,'serial2':7890123,'t2':28.78,'rh2':40.56}";
      var answer=document.getElementById("answer_hardware_json");
      answer.innerHTML=json_str;
      json_parsed=JSON.parse(json_str);
      //var json_date=document.getElementById("json_date");
      //json_date.val(json_parsed.datetime.substring(0,10));
      var measurement_date=document.getElementById("answer_hardware_date");
      measurement_date.innerHTML=json_parsed.datetime.substring(0,10);
      var measurement_time=document.getElementById("answer_hardware_time");
      measurement_time.innerHTML=json_parsed.datetime.substring(11,19);
      var serial1=document.getElementById("answer_hardware_serial1");
      serial1.innerHTML=json_parsed.serial1.toString(16).toUpperCase();
      var t1=document.getElementById("answer_hardware_t1");
      t1.innerHTML=json_parsed.t1.toFixed(2);
      var rh1=document.getElementById("answer_hardware_rh1");
      rh1.innerHTML=json_parsed.rh1.toFixed(2);
      var serial2=document.getElementById("answer_hardware_serial2");
      serial2.innerHTML=json_parsed.serial2.toString(16).toUpperCase();
      var t2=document.getElementById("answer_hardware_t2");
      t2.innerHTML=json_parsed.t2.toFixed(2);
      var rh2=document.getElementById("answer_hardware_rh2");
      rh2.innerHTML=json_parsed.rh2.toFixed(2);
    }

    function form_answer_hardware_json()
    {
      // query (port) is string like "1" or empty
      var query=document.getElementById("query_hardware_json").value;
      var answer=document.getElementById("answer_hardware_json");
      // answer from hardware in json format
      fetch("json?port="+query)
      .then(response => {return response.text();})
      //.then(text => answer.innerHTML=text);
      .then(text => {return update_html_from_json(text);});
      // answer is string like:
      // "{'serial1':123456,'t1':29.26,'rh1':40.06,'serial2':7890123,'t2':28.78,'rh2':40.56}"
    }


    function form_answer_emulator()
    {
      // query is string like ":e1"
      var query=document.getElementById("query_emulator").value;
      var answer=document.getElementById("answer_emulator");
      // answer from emulator
      answer.innerHTML=emulator(query);
    }
    
    window.onload = function ()
    {
      // document.getElementById("example_form").addEventListener("submit", answer_form);
      // answer_form();
    }
  </script>
</head>
<body>
  <h1>THERMOHYGROMETER TH2</h1>
  <a href="index.html">Home</a>
  <h2>examples</h2>
  <a href="line">http://host/line</a><br/>
  <a href="json">http://host/json</a><br/>
  <a href="json?port=1">http://host/json?port=1</a>
  <h2>hardware line</h2>
  <form id="form_hardware_line" onsubmit="form_answer_hardware_line();return false">
  <input type="text" name="query_hardware_line" id="query_hardware_line" value="1"/>
  <input type="submit" value="Submit">
  </form>
  <p id="answer_hardware_line">line</p>
  <h2>hardware json</h2>
  <form id="form_hardware_json" onsubmit="form_answer_hardware_json();return false">
  <input type="text" name="query_hardware_json" id="query_hardware_json" value="1"/>
  <input type="submit" value="Submit">
  </form>
  <p id="answer_hardware_json">json</p>
  <table border="1">
    <tr>
      <th>DATE</th>
      <th>TIME [UTC]</th>
      <th>SERIAL1</th>
      <th>RH1 [%]</th>
      <th>T1 [&deg;C]</th>
      <th>SERIAL2</th>
      <th>RH2 [%]</th>
      <th>T2 [&deg;C]</th>
    </tr>
    <tr>
      <td id="answer_hardware_date">?</td>
      <td id="answer_hardware_time">?</td>
      <td id="answer_hardware_serial1">?</td>
      <td id="answer_hardware_rh1">?</td>
      <td id="answer_hardware_t1">?</td>
      <td id="answer_hardware_serial2">?</td>
      <td id="answer_hardware_rh2">?</td>
      <td id="answer_hardware_t2">?</td>
    </tr>
  </table>
  <h2>emulator</h2>
  <form id="form_emulator" onsubmit="form_answer_emulator();return false">
  <input type="text" name="query_emulator" id="query_emulator" value=":e1"/>
  <input type="submit" value="Submit">
  </form>
  <p id="answer_emulator">answer</p>
</body>
</html>
