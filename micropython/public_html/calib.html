    // shorten typing: document.getElementById -> $id
    function $id(id)
    {
      return document.getElementById(id);

    // type is "th" (header) or "td" (data)
    function create_table_row(type,x,y)
    {
      const row = document.createElement('tr');
      const cell_in = document.createElement(type);
      const cell_out = document.createElement(type);
      cell_in.textContent = `${x}`;
      cell_out.textContent = `${y}`;
      row.appendChild(cell_in);
      row.appendChild(cell_out);
      return row;
    }

    // Function to create a table
    function createTable(id,serial,values)
    {
      const table = document.createElement('table');
      table.id = id;
      table.setAttribute("class","editabletable")
      const tbody = document.createElement('tbody');
      tbody.appendChild(create_table_row("th","Serial","Points"));
      const serial_hex=parseInt(serial).toString(16).toUpperCase();
      const npoints=Object.keys(values).length;
      tbody.appendChild(create_table_row("td",serial_hex,Math.floor(npoints/2)));
      tbody.appendChild(create_table_row("th","in T [°C]","out T [°C]"));
      for(var n=0; n<npoints; n+=2)
        tbody.appendChild(create_table_row("td",values[n],values[n+1]));
      table.appendChild(tbody);
      return table;
    }

    function populate_tables(json_str)
    {
      // Populate the array with tables
      var json_parsed=JSON.parse(json_str);
      var calibration_tables=document.getElementById("calibration_tables");
      const tablesArray = [];
      for(const serial in json_parsed)
        for(const unit in json_parsed[serial])
        {
          const table =
          createTable(`calib_${serial}_${unit}`,serial,json_parsed[serial][unit]);
          tablesArray.push(table);
          calibration_tables.appendChild(table); // Append to the body or a specific parent element
          const newline=document.createElement("br");
          calibration_tables.appendChild(newline);
        }
    }

    function deleteRowsBelow(table,index)
    {
      // var table = document.getElementById("myTable");
      var rowCount = table.rows.length;
      // Loop through the rows starting from the index + 1
      for (var i = rowCount-1; i > index; i--)
        table.deleteRow(i);
    }

    function add_log_download_link(filename)
    {
      // \D matches a character that is not a numerical digit.
      // So any non digit is replaced by an empty string.
      // The result is only the digits in a string.
      var year=filename.replace(/\D/g, "");
      var temp_link = document.createElement("a");

      temp_link.href = filename;
      temp_link.innerHTML = year;

      const textnode = document.createTextNode(" ");

      //var par = document.createElement("p");
      //par.appendChild(temp_link);
      // TODO when year mod 10 = 9 then add <br/> node
      // every year ending with 9 should have newline

      document.getElementById("download_list").appendChild(temp_link);
      document.getElementById("download_list").appendChild(textnode);
      if(year.endsWith("9"))
      {
        var newline=document.createElement("br");
        document.getElementById("download_list").appendChild(newline);
      }
    }

    function getTimeUntilNextMinute()
    {
      const now = new Date();
      //const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();
      // If exactly on the minute, run immediately (delay = 0)
      if (seconds === 0 && milliseconds === 0) {
        return 0;
      }
      // Calculate time until next minute (in ms)
      return (60-seconds)*1000 - milliseconds;
    }
 
    function runAtEveryFullMinute(callback) {
      // Calculate delay until next full hour
      const initialDelay = getTimeUntilNextMinute();
 
      // Run once at the next full minute
      setTimeout(() => {
        // Execute the callback
        callback();
        // Schedule subsequent runs every minute
        setInterval(callback, 60*1000); // 1 minute = 60000 ms
      }, initialDelay);
    }
